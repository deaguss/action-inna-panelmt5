<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ActionInna</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="block" id="head">
  <div class="line">
    <strong id="account" class="grow">ActionInna</strong>
    <span id="mode" class="badge" hidden></span>
  </div>
  <div class="line small">
    <span id="conn" class="muted grow">Starting the link…</span>
    <button type="button" id="startMt5" hidden>Start MT5</button>
  </div>
  <label class="line small" id="termRow" hidden><span class="label">MT5</span> <select id="terms" class="grow"></select></label>
</header>

<section class="block" id="symbolBlock" aria-label="Symbol and prices">
  <strong id="symbol" class="symbolName">-</strong>
  <div id="followNote" class="small muted" hidden></div>
  <div id="followAsk" class="line small" hidden>
    <button type="button" id="followAllow">Allow access to TradingView</button>
    <span class="muted">so the panel can follow its chart</span>
  </div>
  <div id="cands" class="cands" hidden></div>
  <div class="sides">
    <button type="button" id="sell" class="side sell"><span class="sideName">SELL</span><span id="sellPx" class="px">-</span></button>
    <div class="spreadBox"><span id="spread">-</span><span class="muted">spread</span></div>
    <button type="button" id="buy" class="side buy"><span class="sideName">BUY</span><span id="buyPx" class="px">-</span></button>
  </div>
</section>

<section class="block" id="orderBlock" aria-label="New order">
  <div class="line">
    <div class="seg" role="group" aria-label="Order type">
      <button type="button" id="kindMarket" class="chip">Market</button>
      <button type="button" id="kindPending" class="chip">Pending</button>
    </div>
    <label id="entryRow" class="grow line" hidden><span class="muted">Entry</span> <input id="entry" class="grow" type="text" inputmode="decimal" aria-label="Entry price"></label>
  </div>
  <div class="line" role="group" aria-label="Risk">
    <span class="label">Risk</span>
    <button type="button" class="chip" data-chip="0">1%</button>
    <button type="button" class="chip" data-chip="1">1.5%</button>
    <button type="button" class="chip" data-chip="2">2%</button>
    <input id="custom" class="grow num" type="text" inputmode="decimal" placeholder="other" aria-label="Your own risk">
    <button type="button" id="customUnit" class="chip unit" aria-label="Your own risk in">%</button>
  </div>
  <div class="line">
    <span class="label">Stop loss</span>
    <input id="sl" class="grow" type="text" inputmode="decimal" aria-label="Stop loss">
    <button type="button" id="slMode" class="chip unit">pips</button>
    <button type="button" id="slLast" class="chip">Last</button>
  </div>
  <div class="line">
    <span class="label">Take profit</span>
    <input id="tp" class="grow" type="text" inputmode="decimal" aria-label="Take profit">
    <button type="button" id="tpMode" class="chip unit">R</button>
    <button type="button" id="tpLast" class="chip">Last</button>
  </div>
  <div id="planBox" class="plan" hidden>
    <div class="summary">
      <div><span class="muted small">Lots</span><strong id="nLots">-</strong></div>
      <div class="right"><span class="muted small">Risk</span><strong id="nRisk">-</strong></div>
    </div>
    <dl id="nums" class="nums">
      <dt>Reward</dt><dd id="nReward">-</dd>
      <dt>Risk : reward</dt><dd id="nRr">-</dd>
      <dt>Distance (pips)</dt><dd id="nDist">-</dd>
      <dt>Pip value</dt><dd id="nPip">-</dd>
      <dt>Margin</dt><dd id="nMargin">-</dd>
    </dl>
    <div class="line">
      <button type="button" id="confirm" class="confirm grow" disabled>Confirm</button>
      <button type="button" id="cancelPreview" class="chip" aria-label="Close the preview">X</button>
    </div>
  </div>
  <div id="status" class="status" role="status"></div>
  <details id="opts" class="opts small">
    <summary>Options</summary>
    <label class="line"><input type="checkbox" id="optAuto"> Set SL/TP from my last trade on the symbol</label>
    <div class="line">Risk in % of <button type="button" id="optBase" class="chip">equity</button></div>
  </details>
</section>

<section class="block" id="tradesBlock" aria-label="Open trades">
  <strong>Open trades</strong>
  <div id="card" class="card" hidden></div>
  <ul id="trades" class="trades"></ul>
  <div id="noTrades" class="muted small">No open trades.</div>
</section>

<script type="module" src="panel.js"></script>
</body>
</html>
